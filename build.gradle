plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.mod_id
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    mavenCentral()
}

loom {
    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            runDir = "run-client"
            // Work around a JDK 25 C2 crash while Minecraft reads model resources.
            // This applies only to the local development client, never the built mod.
            vmArg "-XX:TieredStopAtLevel=1"
        }
        // Isolated diagnostic profile. Its separate run directory has no optional
        // development mods, so it does not alter the normal client profile.
        clientClean {
            client()
            runDir = "run-client-clean"
            vmArg "-XX:TieredStopAtLevel=1"
        }
        server {
            runDir = "run-server"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.mod_id}" }
    }
}

// Fabric 26.3 development convenience: publish a freshly successful local build
// to the dedicated Modrinth test profile. This is deliberately not shared by
// any other version or publication task.
tasks.named("build") {
    doLast {
        copy {
            from tasks.named("jar")
            into "C:/Users/isaac/AppData/Roaming/ModrinthApp/profiles/Fabric 26.3/mods"
        }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.mod_id
            from components.java
        }
    }
    repositories {}
}
