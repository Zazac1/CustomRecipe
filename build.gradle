buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'maven-publish'
}

apply plugin: 'org.spongepowered.mixin'

if (project.hasProperty('basicValidation')) { sourceSets.main.java.srcDir 'validation/src/main/java' }

// This source set belongs only to the unauthenticated ForgeGradle client.
// It is not included in the mod JAR or the dedicated-server launch.
sourceSets {
    localDevelopment {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.mod_id }

minecraft {
    mappings channel: 'official', version: project.minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // The manifest registers this for packaged builds; userdev runs
            // need the config explicitly so client mixins are applied too.
            arg '-mixin.config=customrecipe.mixins.json'
            mods { "${project.mod_id}" { source sourceSets.main } }
        }
        client {
            workingDirectory project.file('run/client')
            mods { "${project.mod_id}" { source sourceSets.localDevelopment } }
            arg '-mixin.config=customrecipe.development.mixins.json'
        }
        server { workingDirectory project.file('run/server'); args '--nogui' }
    }
}

repositories {
    // Production JARs for local compatibility testing. Declaring this as a
    // repository (rather than files(...)) lets ForgeGradle remap their names
    // from the production namespace to the development namespace.
    flatDir { dirs 'dev-mods' }
    maven {
        name = 'BlameJared Maven'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'Shedaniel Maven'
        url = 'https://maven.shedaniel.me/'
    }
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}"
    implementation fg.deobf("me.shedaniel.cloth:cloth-config-forge:${project.cloth_config_version}")

    // JEI is optional for players. The APIs compile the client plugin, while
    // the full mod is present only in the development runtime and is remapped
    // by ForgeGradle for Mojang mappings.

    compileOnly fg.deobf("mezz.jei:jei-1.16.5:${project.jei_version}:api")
    runtimeOnly fg.deobf("mezz.jei:jei-1.16.5:${project.jei_version}")

    // Local mods used to test compatibility. They must go through ForgeGradle's
    // deobfuscation layer in a development run; raw production jars in
    // run/mods use different method names and crash at startup.
    if (file('dev-mods/balm-forge-1.20.1-7.3.44.jar').exists()) {
        runtimeOnly fg.deobf('local.test:balm-forge-1.20.1:7.3.44')
    }
    if (file('dev-mods/waystones-forge-1.20.1-14.1.21.jar').exists()) {
        runtimeOnly fg.deobf('local.test:waystones-forge-1.20.1:14.1.21')
    }

    // Generates the refmap that translates Mojang names in mixins to the
    // obfuscated names present in a distributed Forge installation.
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    annotationProcessor 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.0'
}

mixin {
    add sourceSets.main, 'customrecipe.refmap.json'
    config 'customrecipe.mixins.json'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') { expand 'version': project.version }
}

tasks.named('compileJava', JavaCompile) {
    sourceCompatibility = '17'
    options.release = 8
    options.compilerArgs += ['-Xplugin:jabel', '-Xmaxerrs', '250']
    options.encoding = 'UTF-8'
}

tasks.named('compileLocalDevelopmentJava', JavaCompile) {
    options.release = 8
    options.encoding = 'UTF-8'
}

// ForgeGradle otherwise gives runServer an empty input stream: commands typed
// in the development terminal never reach Minecraft's dedicated-server console.
tasks.withType(JavaExec).configureEach {
    if (name == 'runServer') {
        standardInput = System.in
    }
}

// ForgeGradle exposes these tasks without descriptions.  Development tools
// that read `gradlew tasks --all` use the standard "task - description"
// format to discover launch targets, so advertise both targets explicitly.
tasks.configureEach {
    if (name == 'runClient') {
        group = 'ForgeGradle runs'
        description = 'Launches the Custom Recipe development client.'
        dependsOn tasks.named('localDevelopmentClasses')
    } else if (name == 'runServer') {
        group = 'ForgeGradle runs'
        description = 'Launches the Custom Recipe development server.'
    }
}
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

jar {
    exclude 'fr/zazac1/customrecipe/validation/**'
    exclude 'fr/zazac1/customrecipe/development/**', 'customrecipe.development.mixins.json'
    manifest { attributes([
        'Specification-Title': project.mod_id,
        'Specification-Vendor': 'zazac1',
        'Specification-Version': '1',
        'Implementation-Title': project.name,
        'Implementation-Version': project.jar.archiveVersion,
        'Implementation-Vendor': 'zazac1',
        'MixinConfigs': 'customrecipe.mixins.json'
    ]) }
    from('LICENSE') { rename { "${it}_${project.mod_id}" } }
}

publishing {
    publications { mavenJava(MavenPublication) { artifact jar } }
    repositories { }
}

jar.finalizedBy('reobfJar')

// The legacy launcher runs on Java 8; only compilation uses the JDK 17 compiler.
tasks.withType(JavaExec).configureEach {
    if (name in ['runClient', 'runServer']) { javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) } }
}
