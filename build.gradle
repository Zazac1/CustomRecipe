plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.mod_id }

repositories { mavenCentral() }

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }
    client { }
    server { argument '--nogui' }
}

configurations { runtimeClasspath.extendsFrom localRuntime }

dependencies {
    implementation "net.neoforged:neoforge:${project.neo_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand 'version': project.version,
                'minecraft_version_range': project.minecraft_version_range,
                'neo_version': project.neo_version,
                'loader_version_range': project.loader_version_range
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

// NeoGradle otherwise starts the dedicated server with Gradle's closed input
// stream. Keep the visible run-local-test terminal interactive so commands
// such as `stop` and `/customrecipe` reach the Minecraft server console.
tasks.withType(JavaExec).configureEach {
    if (name == 'runServer') {
        standardInput = System.in
    }
}

java { toolchain.languageVersion = JavaLanguageVersion.of(21) }

jar {
    manifest { attributes(['MixinConfigs': 'customrecipe.mixins.json']) }
    from('LICENSE') { rename { "${it}_${project.mod_id}" } }
}

publishing { publications { mavenJava(MavenPublication) { artifact jar } } }
