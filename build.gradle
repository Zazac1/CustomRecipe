plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

if (project.hasProperty('clientStartupValidation')) { sourceSets.main.java.srcDir '../validation/client-smoke/src/main/java' }
if (project.hasProperty('recipeSyncValidation')) { sourceSets.main.java.srcDir '../validation/recipe-sync/mojang/src/main/java' }
version = project.mod_version
group = project.maven_group

base {
    archivesName = project.mod_id
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    mavenCentral()
}

loom {
    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }

    runs {
        client {
            runDir = providers.gradleProperty("client_run_dir").getOrElse("run-client")
            // Match the stable memory/stack settings used by the working
            // Modrinth 26.3 profile. This affects the dev client only.
            vmArgs "-Xmx4096M", "-XX:StackShadowPages=32"
        }
        // Isolated diagnostic profile. Its separate run directory has no optional
        // development mods, so it does not alter the normal client profile.
        clientClean {
            client()
            runDir = "run-client-clean"
            vmArgs "-Xmx4096M", "-XX:StackShadowPages=32"
        }
        // Deterministic client-side visual validation. The runner source is
        // included only when -PvisualValidation is present, so it can never be
        // shipped in a normal release JAR.
        visualValidationClient {
            client()
            runDir = "../validation/runtime/Fabric_26.3-client"
            vmArgs "-Xmx4096M", "-XX:StackShadowPages=32",
                    "-Dcustomrecipe.visualValidation=true"
            programArgs "--width", "1920", "--height", "1080"
        }
        server {
            runDir = providers.gradleProperty("server_run_dir").getOrElse("run-server")
        }
    }
}

if (project.hasProperty("visualValidation")) {
    sourceSets.main.java.srcDir "validation/src/client/java"
}

// Gradle and compilation stay on the project JDK.  Only the local Fabric client
// uses Modrinth's known-good Zulu JRE when it is installed on this workstation.
// JavaExec requires java.exe to match Gradle's Java toolchain identity.
def modrinthAppData = System.getenv("APPDATA")
if (modrinthAppData != null) {
    def modrinthClientJava = file("${modrinthAppData}/ModrinthApp/meta/java_versions/zulu25.36.205-ca-jre25.0.4.1-win_x64/bin/java.exe")
    if (modrinthClientJava.isFile()) {
        ["runClient", "runClientClean", "runVisualValidationClient"].each { taskName ->
            tasks.named(taskName, JavaExec).configure {
                executable = modrinthClientJava.absolutePath
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

tasks.register("testDatapackExport", JavaExec) {
    group = "verification"
    description = "Generates and validates representative Custom Recipe datapack exports."
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "fr.zazac1.customrecipe.client.DatapackExporterSmoke"
}

tasks.named("test") {
    failOnNoDiscoveredTests = false
}

tasks.named("check") {
    dependsOn tasks.named("testDatapackExport")
}

jar {
    exclude 'fr/zazac1/customrecipe/validation/**'
    from('LICENSE') {
        rename { "${it}_${project.mod_id}" }
    }
}

// Fabric 26.3 development convenience: publish a freshly successful local build
// to the dedicated Modrinth test profile. This is deliberately not shared by
// any other version or publication task.
tasks.named("build") {
    doLast {
        if (!project.hasProperty("skipLocalDeployment")) {
            copy {
                from tasks.named("jar")
                into "C:/Users/isaac/AppData/Roaming/ModrinthApp/profiles/Fabric 26.3/mods"
            }
        }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.mod_id
            from components.java
        }
    }
    repositories {}
}
